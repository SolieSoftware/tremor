[project]
name = "tremor"
version = "0.1.0"
description = "Event-driven signal factory and causal shock monitor for financial markets"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "statsmodels>=0.14.0",
    "networkx>=3.0",
    "yfinance>=0.2.0",
    "simpleeval>=0.9.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
# LLM-based scrapers (fed, rss, whitehouse); also run `playwright install chromium`
scrapers = [
    "anthropic>=1.11.0",
    "playwright>=1.40.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["tremor*"]
